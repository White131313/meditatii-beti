<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0f172a" />

  <!--
    SEO: titlul, descrierea, canonical, hreflang, Open Graph și JSON-LD NU se scriu aici.
    scripts/prerender.mjs le generează pentru fiecare pagină (RO și HU) din src/lib/seoRoutes.js
    și înlocuiește <title> de mai jos; în browser, SEOHead le actualizează la navigare.
  -->
  <title>Vorbim Românește</title>
  <meta name="author" content="Beatrice Bernad" />
  <meta name="google-site-verification" content="hVRy9Khe2QaPAJe8RKpEDpEaMkUBMjVOtt60EyHB2J8" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">

  <!-- PDF.js -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // pdf.js is deferred, so wire the worker once it has actually parsed.
    window.addEventListener('DOMContentLoaded', function () {
      if (window['pdfjs-dist/build/pdf']) {
        window.pdfjsLib = window['pdfjs-dist/build/pdf'];
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    });
  </script>

  <!--
    Google Analytics is NOT loaded here on purpose. It is injected by
    src/lib/analytics.js only after the visitor accepts analytics cookies (GDPR).
  -->
</head>

<body>
  <div id="root"></div>
  <noscript>
    <p style="max-width:42rem;margin:1rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif">
      Jocurile interactive și contul necesită JavaScript activat în browser.
    </p>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
